<!-- Subtle Ambient Academic Glow Backdrop -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-80 bg-gradient-to-b from-primary-fixed/25 via-secondary-fixed/15 to-transparent rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Crest & Portal Brand Anchor -->

<div class="relative group cursor-pointer transition-transform duration-300 active:scale-95">
<div class="absolute -inset-2 bg-gradient-to-tr from-primary/20 via-tertiary-fixed/30 to-secondary-container/20 rounded-full blur-md opacity-70"></div>
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-[0_8px_24px_rgba(0,76,68,0.12)] p-2 flex items-center justify-center">
<img alt="The Eduverse Crest" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1Ub-X54G6CzNuc3vYGYR6fkBeoIsYteMaRzNjHMmFZPfl56qQ8hmRPUjoEijGjH0jXBtHJz3Kchcc98nfcJ0ucBJ82IihwZUZVueHTHMUYSGN-k2IQGeKtBjKd_wpYM5CE2x-_dMMFIdpFaacInX81MKiI5PVhuqnIW0etmglr2toPXsUKQKHy6oQ9g8I1KvANFJOZEOvs7jIRPVGHMDEX2-f4xITccSpJRfOmuVFBHhyT0DhxedfStF00">
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[14px]">auto_awesome</span>
</div>
</div>
<!-- Portal Pill Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 mt-3.5 rounded-full bg-surface-container shadow-[0_2px_8px_rgba(0,104,117,0.06)]">
<span class="material-symbols-outlined text-secondary text-[14px]">school</span>
<span class="font-label-sm text-label-sm text-secondary font-semibold tracking-wider uppercase">Aspirant Portal</span>
</div>
<!-- Academic Header Typography -->
<h2 class="font-headline-lg text-headline-lg text-on-surface mt-3">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-1.5 leading-relaxed">
      Enter your credentials to continue your academic journey
    </p>
</div>
<!-- Login Card Form Wrapper -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_10px_32px_rgba(4,11,20,0.06)] transition-all">
<form class="flex flex-col gap-4" id="scholarLoginForm" onsubmit="event.preventDefault(); triggerLogin();">
<!-- Input 1: Identifier -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center justify-between" for="scholarId">
<span class="">Email or Mobile Number</span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">Academic ID</span>
</label>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#00665c]">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none transition-colors group-focus-within:text-primary">
            alternate_email
          </span>
<input class="w-full h-12 pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none rounded-lg" id="scholarId" placeholder="scholar@eduverse.edu or +91" required="" type="text">
</div>
</div>
<!-- Input 2: Password -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="scholarPassword">Master Password</label>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors focus:outline-none" onclick="showForgotFeedback()" type="button">
            Forgot Password?
          </button>
</div>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#00665c]">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
            key
          </span>
<input class="w-full h-12 pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none rounded-lg" id="scholarPassword" placeholder="Enter institutional cipher" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors" id="togglePassBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePassIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember device quick toggle -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded bg-surface-container text-primary accent-primary focus:ring-0 cursor-pointer" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant">Remember this Device</span>
</label>

</div>
<!-- Primary Action Button -->
<button class="w-full h-13 mt-1 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_6px_20px_rgba(0,102,92,0.25)] active:scale-[0.98] hover:bg-primary transition-all duration-200" id="submitBtn" type="submit">
<span id="submitLabel" class="">Sign In to Portal</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Divider: OR CONTINUE WITH -->
<div class="relative flex items-center justify-center my-5">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-px bg-surface-variant"></div>
</div>
<span class="relative px-3 bg-surface-container-lowest font-label-sm text-label-sm text-outline tracking-wider uppercase text-[11px]">
        OR CONTINUE WITH
      </span>
</div>
<!-- Secondary Social / OTP Auth Buttons -->
<div class="flex flex-col gap-2.5">
<!-- Phone OTP Quick Access -->
<button class="w-full h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2.5 hover:bg-surface-container transition-colors active:scale-[0.99]" onclick="triggerOtpModal()" type="button">
<span class="material-symbols-outlined text-secondary text-[20px]">smartphone</span>
<span class="">Login with OTP / Phone Number</span>
</button>
<!-- Google Academic SSO -->
<button class="w-full h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2.5 hover:bg-surface-container transition-colors active:scale-[0.99]" onclick="triggerGoogleSso()" type="button">
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
</div>
</div>
<!-- Interactive Feedback Toast Slot -->
<div class="hidden mt-3 px-4 py-2.5 rounded-lg bg-surface-container text-secondary text-center font-label-sm text-label-sm shadow-sm transition-all duration-300" id="statusToast">
    Verifying credentials with academic database...
  </div>
<!-- Registration Link & Academic Assurance Footer -->
<div class="flex flex-col items-center gap-3 mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      New aspirant? 
      <button class="font-label-lg text-label-lg text-primary font-semibold hover:underline inline-flex items-center gap-0.5 ml-1" onclick="triggerRegister()" type="button">
<span class="">Register Now</span>
<span class="material-symbols-outlined text-[16px]">north_east</span>
</button>
</p>
<!-- 256-bit Academic Protocol Seal -->
<div class="flex items-center justify-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low max-w-fit">


</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('scholarPassword');
    const icon = document.getElementById('togglePassIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showToast(message, isSuccess = true) {
    const toast = document.getElementById('statusToast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    if (isSuccess) {
      toast.className = "mt-3 px-4 py-2.5 rounded-lg bg-primary-fixed/50 text-on-primary-fixed-variant text-center font-label-sm text-label-sm shadow-sm transition-all duration-300";
    } else {
      toast.className = "mt-3 px-4 py-2.5 rounded-lg bg-surface-container text-on-surface-variant text-center font-label-sm text-label-sm shadow-sm transition-all duration-300";
    }
    setTimeout(() => {
      toast.classList.add('hidden');
    }, 3200);
  }

  function triggerLogin() {
    const id = document.getElementById('scholarId').value;
    const btn = document.getElementById('submitBtn');
    const label = document.getElementById('submitLabel');
    
    label.textContent = "Authenticating Scholar...";
    btn.classList.add('opacity-90', 'pointer-events-none');
    
    setTimeout(() => {
      label.textContent = "Sign In to Portal";
      btn.classList.remove('opacity-90', 'pointer-events-none');
      showToast("Access Granted. Launching Eduverse Workspace...", true);
    }, 1200);
  }

  function showForgotFeedback() {
    showToast("Password reset dispatched to recovery contact", false);
  }

  function triggerOtpModal() {
    showToast("Requesting instant one-time campus passcode...", false);
  }

  function triggerGoogleSso() {
    showToast("Connecting to Institutional Single Sign-On...", true);
  }

  function triggerRegister() {
    showToast("Routing to Aspirant Enrollment Dossier...", true);
  }
</script></main>

</body></html>
