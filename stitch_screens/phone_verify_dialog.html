<script>
  (function() {
    const inputs = document.querySelectorAll('.otp-box');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    let timeLeft = 28;
    const timerElem = document.getElementById('otp-timer');
    const resendBtn = document.getElementById('resend-btn');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        if (timerElem) timerElem.textContent = '0:00';
        if (resendBtn) {
          resendBtn.removeAttribute('disabled');
          resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
          resendBtn.classList.add('text-emerald-vivid', 'hover:text-primary', 'cursor-pointer', 'font-semibold');
        }
      } else {
        if (timerElem) {
          timerElem.textContent = '0:' + (timeLeft < 10 ? '0' + timeLeft : timeLeft);
        }
      }
    }, 1000);
  })();
