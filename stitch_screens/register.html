<div class="absolute top-48 -left-20 w-48 h-48 rounded-full bg-secondary-fixed/20 blur-2xl pointer-events-none"></div>

<div class="flex items-center gap-3">

<img class="inline-block h-8 w-8 rounded-full object-cover shadow-sm" data-alt="Portrait of an intelligent female civil service candidate looking directly at the camera with determination against an academic bookshelf background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR91JckLCVBZmH3YLGJTzw1Gnx1WjklmJ2gZqXrXRiPN1Dp5xaOPXLXEhKNjEK6KVKN0Juxg_Scav2fMKWIBhlPHnmw3CO05zqS8-q1wB21nJ6yIvr-QMh2iNpTipYdND_Tp4LVVgxXJ3OyqMhqeE9ML5uwtbJp2AnU7s6fGgKfxd2VYgMfLdfeh4AH2KxLmkEYfvaU_3tGfb7z-0tZGOLvd6V-t3oOegSF9iOJRfcVt7NVFa02uV5">
</div>
<div class="flex flex-col">
<div class="flex items-center gap-1">
<span class="font-label-sm text-label-sm font-bold text-primary">18,450+ Active Aspirants</span>
<span class="material-symbols-outlined text-tertiary-container text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">stars</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">Ranked #1 Civil Prep Community 2024</span>
</div>
</div>
<!-- Registration Card Form -->
<form class="flex flex-col gap-4 bg-surface-container-lowest p-5 rounded-2xl shadow-md z-10" id="registerForm" onsubmit="event.preventDefault();">
<!-- 1. Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="fullName">
<span class="material-symbols-outlined text-[18px] text-primary">badge</span>
          Full Name
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface focus:shadow-[0_0_0_2px_rgba(0,102,92,0.35)] transition-all" id="fullName" name="fullName" placeholder="e.g. Ananya Sharma" required="" type="text">
</div>
</div>
<!-- 2. Email Address -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="email">
<span class="material-symbols-outlined text-[18px] text-primary">mail</span>
          Email Address
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface focus:shadow-[0_0_0_2px_rgba(0,102,92,0.35)] transition-all" id="email" name="email" placeholder="aspirant@eduverse.org" required="" type="email">
</div>
</div>
<!-- 3. Mobile Number -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="mobileNumber">
<span class="material-symbols-outlined text-[18px] text-primary">phone_iphone</span>
          Mobile Number
        </label>
<div class="flex gap-2">
<div class="h-12 px-3 rounded-xl bg-surface-container-low flex items-center gap-1.5 select-none shadow-sm">
<span class="text-[16px]">🇮🇳</span>
<span class="font-label-lg text-label-lg font-semibold text-on-surface">+91</span>
</div>
<input class="flex-1 h-12 px-4 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface focus:shadow-[0_0_0_2px_rgba(0,102,92,0.35)] transition-all" id="mobileNumber" name="mobileNumber" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel">
</div>
</div>
<!-- 4. Target Exam Selection -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="targetExam">
<span class="material-symbols-outlined text-[18px] text-primary">school</span>
          Target Examination
        </label>
<div class="relative flex items-center">
<select class="w-full h-12 pl-4 pr-10 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md appearance-none focus:outline-none focus:bg-surface focus:shadow-[0_0_0_2px_rgba(0,102,92,0.35)] transition-all cursor-pointer" id="targetExam" name="targetExam" required="">
<option disabled="" selected="" value="">Select Your Primary Goal</option>
<option value="upsc">UPSC Civil Services (IAS / IFS / IPS)</option>
<option value="state_psc">State PSC (UPPSC, BPSC, MPPSC, etc.)</option>
<option value="ssc_cgl">SSC Combined Graduate Level (CGL)</option>
<option value="banking_rbi">Banking &amp; RBI Grade B Officers</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-3 text-on-surface-variant text-[20px]">
            expand_more
          </span>
</div>
</div>
<!-- 5. Password & Visibility Toggle -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="password">
<span class="material-symbols-outlined text-[18px] text-primary">lock_reset</span>
          Create Secure Password
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface focus:shadow-[0_0_0_2px_rgba(0,102,92,0.35)] transition-all" id="password" minlength="8" name="password" placeholder="At least 8 characters" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2 w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="flex items-center gap-1.5 mt-1">
<div class="flex gap-1 flex-1">
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors" id="str-1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors" id="str-2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors" id="str-3"></div>
<div class="h-1 flex-1 rounded-full bg-surface-variant transition-colors" id="str-4"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]" id="strengthLabel">Minimum 8 characters</span>
</div>
</div>
<!-- 6. Agreement Checkbox -->
<label class="flex items-start gap-3 mt-1 cursor-pointer select-none">
<input class="mt-1 h-4 w-4 rounded accent-primary text-primary focus:ring-0 cursor-pointer" id="termsCheckbox" required="" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant leading-snug">
          I pledge adherence to the Academy Honor Code and accept the 
          <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> &amp; 
          <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
        </span>
</label>
<!-- Primary Call to Action Button -->
<button class="w-full h-13 py-3.5 px-4 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg tracking-wide flex items-center justify-center gap-2 shadow-lg hover:shadow-xl active:scale-[0.99] transition-all mt-2 group" id="submitBtn" type="submit">
<span class="">Create Account</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Trust Pillar Footnote -->
<div class="flex items-center justify-center gap-6 px-4 text-on-surface-variant">
<div class="flex items-center gap-1.5">


</div>
<div class="flex items-center gap-1.5">


</div>
</div>
<!-- Login Link Footer -->
<div class="flex items-center justify-center gap-1.5 text-center pt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Already have an account?</span>
<a class="font-label-lg text-label-lg font-bold text-primary hover:underline transition-all" href="#">
        Login here
      </a>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const str1 = document.getElementById('str-1');
    const str2 = document.getElementById('str-2');
    const str3 = document.getElementById('str-3');
    const str4 = document.getElementById('str-4');
    const strengthLabel = document.getElementById('strengthLabel');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (passwordInput) {
      passwordInput.addEventListener('input', (e) => {
        const val = e.target.value;
        const len = val.length;
        
        // Reset classes
        [str1, str2, str3, str4].forEach(el => {
          el.className = 'h-1 flex-1 rounded-full bg-surface-variant transition-colors';
        });

        if (len === 0) {
          strengthLabel.textContent = 'Minimum 8 characters';
          strengthLabel.className = 'font-label-sm text-label-sm text-on-surface-variant text-[11px]';
        } else if (len < 6) {
          str1.className = 'h-1 flex-1 rounded-full bg-error transition-colors';
          strengthLabel.textContent = 'Weak';
          strengthLabel.className = 'font-label-sm text-label-sm text-error text-[11px] font-semibold';
        } else if (len < 8) {
          str1.className = 'h-1 flex-1 rounded-full bg-tertiary-container transition-colors';
          str2.className = 'h-1 flex-1 rounded-full bg-tertiary-container transition-colors';
          strengthLabel.textContent = 'Fair';
          strengthLabel.className = 'font-label-sm text-label-sm text-tertiary transition-colors text-[11px] font-semibold';
        } else if (len < 12) {
          str1.className = 'h-1 flex-1 rounded-full bg-secondary-fixed-dim transition-colors';
          str2.className = 'h-1 flex-1 rounded-full bg-secondary-fixed-dim transition-colors';
          str3.className = 'h-1 flex-1 rounded-full bg-secondary-fixed-dim transition-colors';
          strengthLabel.textContent = 'Strong';
          strengthLabel.className = 'font-label-sm text-label-sm text-secondary text-[11px] font-semibold';
        } else {
          [str1, str2, str3, str4].forEach(el => {
            el.className = 'h-1 flex-1 rounded-full bg-emerald-vivid transition-colors';
          });
          strengthLabel.textContent = 'Academic Grade';
          strengthLabel.className = 'font-label-sm text-label-sm text-emerald-vivid text-[11px] font-bold';
        }
      });
    }

    const form = document.getElementById('registerForm');
    if (form) {
      form.addEventListener('submit', () => {
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.innerHTML = `
            <span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-on-primary border-t-transparent"></span>
            <span>Enrolling Scholar...</span>
          `;
          setTimeout(() => {
            submitBtn.innerHTML = `
              <span class="material-symbols-outlined text-[20px]">check_circle</span>
              <span>Account Created!</span>
            `;
          }, 1000);
        }
      });
    }
  })();
</script></main>
