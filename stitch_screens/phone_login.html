<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Eduverse - Phone Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#263143",
            "on-background": "#111c2d",

            "on-primary": "#ffffff",
            "emerald-vivid": "#0E9272",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#e7eeff",
            "on-error-container": "#93000a",
            "on-secondary-container": "#00616d",
            "background": "#f9f9ff",
            "surface-container-low": "#f0f3ff",
            "on-tertiary-fixed": "#221b00",
            "secondary-container": "#00e3fd",
            "surface-bright": "#f9f9ff",
            "error": "#ba1a1a",
            "surface": "#f9f9ff",
            "surface-container-highest": "#d8e3fb",
            "inverse-primary": "#86d5c8",
            "on-surface": "#111c2d",
            "primary-container": "#00665c",
            "outline": "#6f7977",
            "surface-variant": "#d8e3fb",
            "outline-variant": "#bec9c6",
            "on-secondary-fixed-variant": "#004f58",
            "on-tertiary": "#ffffff",
            "inverse-on-surface": "#ecf1ff",
            "secondary-fixed-dim": "#00daf3",
            "on-primary-container": "#92e1d4",
            "tertiary-fixed-dim": "#e9c400",
            "error-container": "#ffdad6",
            "surface-dim": "#cfdaf2",
            "tertiary": "#705d00",
            "on-secondary": "#ffffff",
            "surface-gray": "#F8F9FA",
            "deep-navy": "#040B14",
            "on-primary-fixed-variant": "#005048",
            "secondary-fixed": "#9cf0ff",
            "on-tertiary-fixed-variant": "#544600",
            "primary-fixed-dim": "#86d5c8",
            "surface-container-high": "#dee8ff",
            "primary-fixed": "#a2f1e4",
            "on-secondary-fixed": "#001f24",
            "tertiary-container": "#c9a900",
            "primary": "#004c44"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "label-lg": ["Inter"],
            "display-lg": ["Playfair Display"],
            "headline-lg": ["Playfair Display"],
            "body-md": ["Inter"],
            "display-lg-mobile": ["Playfair Display"],

            "headline-md": ["Playfair Display"]

      }

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- Mobile Container (~390px) -->
<main class="w-full max-w-[390px] min-h-screen sm:min-h-[844px] bg-surface-container-lowest flex flex-col justify-between shadow-2xl sm:rounded-[36px] overflow-hidden border border-outline-variant/30">
<!-- Header: Focused View Back Navigation & Brand Emblem -->

<!-- Main Content Area -->
<div class="flex-1 px-6 pt-2 pb-6 flex flex-col justify-start">
<!-- Graphic Accent: Phone/Device security graphic badge -->

<!-- Title & Subtitle -->
<div class="mt-1 mb-6">
<h1 class="font-headline-lg text-[30px] font-bold leading-tight text-on-surface">
          Phone Login
        </h1>
<p class="mt-2 text-on-surface-variant text-sm font-normal leading-relaxed">
          Enter your registered mobile number to receive a 6-digit verification code (OTP) via SMS or WhatsApp.
        </p>
</div>
<!-- Form Inputs -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-on-surface uppercase tracking-wider" for="phone-input">
            Mobile Number
          </label>
<div class="flex items-stretch rounded-xl border border-outline-variant bg-surface-bright focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all shadow-sm overflow-hidden h-14">
<!-- Custom Country Selector Dropdown -->
<button class="flex items-center gap-1.5 px-3.5 bg-surface-container-low border-r border-outline-variant/60 hover:bg-surface-container transition-colors text-on-surface select-none" type="button">
<span class="text-base leading-none">🇮🇳</span>
<span class="text-sm font-semibold text-on-surface tracking-tight">+91</span>
<span class="material-symbols-outlined text-outline text-[18px]">expand_more</span>
</button>
<!-- Number Input Field -->
<input class="flex-1 px-4 py-3 bg-transparent border-0 text-on-surface text-base font-medium tracking-wide placeholder:text-outline/60 focus:ring-0 focus:outline-none" id="phone-input" inputmode="numeric" maxlength="10" pattern="[0-9]*" placeholder="98765 43210" type="tel">
</div>
</div>
<!-- Channel Option Pills (Toggle) -->
<div class="pt-1">
<label class="text-xs font-semibold text-on-surface-variant block mb-2">Delivery Channel</label>
<div aria-label="OTP Delivery Channel" class="grid grid-cols-2 gap-2.5" role="radiogroup">
<!-- SMS option (Active) -->
<button aria-checked="true" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border-2 border-primary bg-primary-fixed/20 text-primary font-semibold text-xs tracking-wide shadow-sm transition-all" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">sms</span>
<span class="">Send via SMS</span>
</button>
<!-- WhatsApp option (Inactive) -->
<button aria-checked="false" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border border-outline-variant/80 bg-surface-container-lowest text-on-surface-variant hover:border-outline font-medium text-xs tracking-wide transition-all" role="radio" type="button">
<span class="material-symbols-outlined text-[18px] text-emerald-vivid">chat</span>
<span class="">Send via WhatsApp</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-3">
<button class="w-full h-13 py-3.5 px-6 rounded-xl bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-semibold text-sm tracking-wide shadow-md flex items-center justify-center gap-2 transition-all" type="submit">
<span class="">Request OTP Code</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider 'OR' -->
<div class="relative my-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/60"></div>
</div>
<div class="relative bg-surface-container-lowest px-3">
<span class="text-xs uppercase tracking-widest text-outline font-bold">OR</span>
</div>
</div>
<!-- Alternative Pathway: Email & Password -->
<div>
<button class="w-full h-12 rounded-xl border border-outline-variant/80 hover:bg-surface-container-low text-on-surface font-semibold text-xs tracking-wide flex items-center justify-center gap-2.5 transition-colors" type="button">
<span class="material-symbols-outlined text-secondary text-[20px]">mail</span>
<span class="">Login with Email &amp; Password</span>
</button>
</div>
</div>
<!-- Bottom Trust Badge Footer -->
<footer class="p-4 bg-surface-container-low/60 border-t border-outline-variant/40">
<div class="flex items-start justify-center gap-2 text-center max-w-[320px] mx-auto">
<span class="material-symbols-outlined text-primary text-[18px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">security</span>
<p class="text-[11px] leading-relaxed text-on-surface-variant font-medium">
          Secured by Eduverse Authentication Shield <span class="mx-0.5">•</span> Single-device session protection
        </p>
</div>
</footer>
</main>


</body></html>
